name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Codex CLI
        run: npm install -g @openai/codex

      - name: Generate diff
        id: diff
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.ref }}"
          git diff "origin/${base}...HEAD" > /tmp/pr.diff
          lines=$(wc -l < /tmp/pr.diff)
          echo "lines=${lines}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Run Codex review
        id: codex
        if: steps.diff.outputs.lines != '0'
        run: |
          set -euo pipefail
          codex exec --approval-mode never \
            "Review this PR diff against the ${{ steps.diff.outputs.base }} branch. Focus on bugs, security issues, and regressions. Be concise — bullet points only. Say LGTM if fine." \
            < /tmp/pr.diff > /tmp/codex-review.txt 2>&1 || true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Post review comment
        if: steps.diff.outputs.lines != '0'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-file: /tmp/codex-review.txt
